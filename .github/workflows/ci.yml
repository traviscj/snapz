name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: snapz_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      # JDK and Gradle are pinned by hermit (server/bin), same as on a laptop.
      - name: test
        working-directory: server
        run: |
          . bin/activate-hermit
          hermit install          # activation only sets paths; this fetches the pinned JDK and Gradle
          gradle test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: server/build/reports/tests/test

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/*.py
