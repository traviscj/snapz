# XcodeGen spec:  brew install xcodegen && xcodegen && open Snapz.xcodeproj
name: Snapz
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing team, bundle id prefix and default server come from Config.xcconfig -> Local.xcconfig.
    CODE_SIGN_STYLE: Automatic
targets:
  Snapz:
    type: application
    platform: iOS
    sources: [Snapz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SNAPZ_BUNDLE_PREFIX).snapz
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SnapzShare
    entitlements:
      path: Snapz/Snapz.entitlements
      properties:
        # Shared with the share extension: the upload queue, a few settings, and the device token.
        com.apple.security.application-groups: [group.$(SNAPZ_BUNDLE_PREFIX).snapz]
    info:
      path: Snapz/Info.plist
      properties:
        CFBundleDisplayName: Snapz
        SnapzDefaultServer: $(SNAPZ_DEFAULT_SERVER)
        SnapzLegacyServers: $(SNAPZ_LEGACY_SERVERS)
        SnapzAppGroup: group.$(SNAPZ_BUNDLE_PREFIX).snapz
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Snapz takes photos straight into your own collections, never into the Photos library.
        # /auth/callback ends by redirecting to snapz://auth?code=...
        CFBundleURLTypes:
          - CFBundleURLName: $(SNAPZ_BUNDLE_PREFIX).snapz.auth
            CFBundleURLSchemes: [snapz]
        NSAppTransportSecurity:
          # plain-http servers on the LAN (dev); real deployments are https
          NSAllowsLocalNetworking: true
  # "Share → Snapz" from Photos, the screenshot editor, etc. Uploads through the app's own queue.
  SnapzShare:
    type: app-extension
    platform: iOS
    sources:
      - SnapzShare
      - Snapz/API.swift
      - Snapz/Models.swift
      - Snapz/Keychain.swift
      - Snapz/Shared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SNAPZ_BUNDLE_PREFIX).snapz.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: SnapzShare/SnapzShare.entitlements
      properties:
        com.apple.security.application-groups: [group.$(SNAPZ_BUNDLE_PREFIX).snapz]
    info:
      path: SnapzShare/Info.plist
      properties:
        CFBundleDisplayName: Snapz
        SnapzAppGroup: group.$(SNAPZ_BUNDLE_PREFIX).snapz
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
  SnapzUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SnapzUITests]
    dependencies:
      - target: Snapz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SNAPZ_BUNDLE_PREFIX).snapz.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Snapz:
    build:
      targets:
        Snapz: all
        SnapzUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SnapzUITests]
