<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snapz</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
:root{--bg:#0b0e11;--bg2:#12161b;--bg3:#1a2027;--line:#252c35;--fg:#d7dde3;--dim:#6b7580;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff;--sel:#1f3a5f;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme: light){:root{--bg:#f6f7f8;--bg2:#eceef1;--bg3:#e1e4e8;--line:#cfd4da;--fg:#1b1f24;--dim:#6a737d;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;--acc:#0969da;--sel:#cfe3ff}}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:12px/1.25 var(--mono);margin:0;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
table{border-collapse:collapse;width:100%}
th,td{padding:1px 6px;white-space:nowrap;text-align:left}
th{color:var(--dim);font-weight:400;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:#80808010}
tbody tr.sel{background:var(--sel)}
tbody tr.cur{outline:1px solid var(--acc);outline-offset:-1px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad);font-weight:700}.dim{color:var(--dim)}.acc{color:var(--acc)}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);padding:1px 6px;border-radius:2px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--acc)}button:disabled{color:var(--dim);cursor:default}
button.danger:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
input:focus,textarea:focus,select:focus{outline:1px solid var(--acc);outline-offset:-1px}
#top{display:flex;gap:10px;align-items:center;padding:2px 8px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
#top b{color:var(--acc)}
#top img{height:16px;width:16px;border-radius:3px;display:block}
#vault{font-weight:700;border-color:var(--acc);max-width:220px}
#top .tab{cursor:pointer;padding:0 4px;color:var(--dim)}#top .tab.on{color:var(--fg);font-weight:700;border-bottom:1px solid var(--acc)}
#top .sp{flex:1}
#main{flex:1;display:flex;min-height:0}
#side{width:270px;flex:none;border-right:1px solid var(--line);overflow:auto}
#side tr{cursor:pointer}#side tr.on{background:var(--sel)}
#side td.name{max-width:120px;overflow:hidden;text-overflow:ellipsis}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:6px;align-items:center;padding:2px 6px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
#bar .sp{flex:1}
#content{flex:1;overflow:auto;position:relative}
#content.drop{outline:2px dashed var(--acc);outline-offset:-4px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,112px),1fr));gap:2px;padding:2px}
.t{position:relative;aspect-ratio:1;background:var(--bg3);cursor:pointer;overflow:hidden}
.t img{width:100%;height:100%;object-fit:cover;display:block}
.t .cap{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#ddd;font-size:10px;line-height:1.15;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .bc{position:absolute;top:0;left:0;background:#000a;color:var(--ok);font-size:10px;line-height:1.15;padding:0 2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .nt{position:absolute;top:0;right:0;background:var(--warn);color:#000;font-size:10px;line-height:1.15;padding:0 2px}
.t.sel{outline:2px solid var(--acc);outline-offset:-2px}.t.sel::after{content:"✓";position:absolute;top:0;right:1px;color:var(--acc);font-weight:700;text-shadow:0 0 2px #000}
.t.cur{box-shadow:inset 0 0 0 2px var(--warn)}
.t.del img{opacity:.45}
#detail{width:380px;flex:none;border-left:1px solid var(--line);overflow:auto;display:none;padding:4px 6px}
#detail.on{display:block}
#detail img{max-width:100%;max-height:55vh;display:block;margin:0 auto 4px;background:var(--bg3)}
#detail dl{display:grid;grid-template-columns:auto 1fr;gap:0 8px;margin:0}
#detail dt{color:var(--dim)}#detail dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#detail textarea{width:100%;min-height:42px;resize:vertical}
#detail pre{margin:2px 0;white-space:pre-wrap;word-break:break-all;background:var(--bg2);padding:2px 4px;max-height:200px;overflow:auto}
.pane{padding:4px 8px;overflow:auto;flex:1}
.pane h3{margin:8px 0 2px;font-size:12px;color:var(--acc);font-weight:700}
.pane h3:first-child{margin-top:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:0 16px}
#status{padding:1px 8px;border-top:1px solid var(--line);background:var(--bg2);flex:none;display:flex;gap:12px;white-space:nowrap;overflow:hidden}
#status .sp{flex:1}
#login{margin:40px auto;width:420px;border:1px solid var(--line);padding:8px 10px;background:var(--bg2)}
#login input{width:100%;margin:2px 0}
.pane table{width:auto;min-width:50%}
code{background:var(--bg3);padding:0 3px}
.imgwrap{position:relative;display:inline-block;max-width:100%;line-height:0}
.imgwrap img{margin:0!important}
.bx{position:absolute;border:2px solid var(--ok);box-shadow:0 0 0 1px #000a;pointer-events:none}
.bx span{position:absolute;left:-2px;bottom:100%;background:var(--ok);color:#000;font-size:10px;line-height:1.2;padding:0 3px;white-space:nowrap;font-weight:700}
.bx.live{border-style:dashed}
/* Phones: collections become a short strip on top, the detail panel a full-screen sheet. */
@media (max-width:700px){
#top{flex-wrap:wrap;gap:4px 8px}#who{display:none}
#main{flex-direction:column}
#side{width:auto;max-height:26vh;border-right:0;border-bottom:1px solid var(--line)}
#detail{position:fixed;inset:0;width:auto;z-index:5;background:var(--bg);border:0}
#login{width:auto;margin:12px 8px}
.cols{grid-template-columns:1fr}
#b-bc{width:9em}
}
/* Touch: bigger targets, and 16px inputs so iOS does not zoom the page on focus. */
@media (pointer:coarse){button,select{padding:5px 9px}input,textarea,select{font-size:16px}}
#b-cam{display:none}@media (pointer:coarse){#b-cam{display:inline-block}}
@keyframes chg{from{box-shadow:inset 0 0 0 3px var(--ok)}to{box-shadow:inset 0 0 0 3px transparent}}
.t.chg::before{content:"";position:absolute;inset:0;animation:chg 2.5s ease-out forwards;z-index:1;pointer-events:none}
tr.chg td{animation:chgrow 2.5s ease-out}
@keyframes chgrow{from{background:color-mix(in srgb,var(--ok) 35%,transparent)}to{background:transparent}}
button.on{color:var(--ok);border-color:var(--ok)}button.off{color:var(--bad);border-color:var(--bad);font-weight:700}
.vers{display:flex;gap:3px;flex-wrap:wrap;margin:2px 0}
.ver{position:relative;width:64px;cursor:pointer;border:2px solid var(--line);background:var(--bg3)}
.ver img{width:100%;height:60px;object-fit:cover;display:block}
.ver.cur{border-color:var(--ok)}
.ver span{display:block;font-size:9px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px}
.sug{display:flex;gap:3px;flex-wrap:wrap;margin:2px 0 4px}
.sug button{position:relative;overflow:hidden;text-align:left;padding:2px 6px;min-width:70px}
.sug button i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);opacity:.28;font-style:normal}
.sug button b,.sug button small{position:relative}
.t .sg{position:absolute;top:0;right:0;background:#000a;color:var(--acc);font-size:10px;line-height:1.15;padding:0 2px}
.st-pending{color:var(--warn)}.st-ok{color:var(--ok)}.st-skipped{color:var(--dim)}.st-halt{color:var(--acc)}.st-error{color:var(--bad);font-weight:700}
.chip{display:inline-block;border:1px solid var(--line);background:var(--bg3);padding:0 4px;margin-right:2px;border-radius:2px}
.chip a{color:var(--bad);margin-left:4px;cursor:pointer}
.hide{display:none!important}
td.wrap{white-space:normal;word-break:break-all;max-width:520px}
</style>
</head>
<body>
<div id="top">
  <img src="/icon.png" alt=""><b>snapz</b>
  <select id="vault" class="hide" title="vault: a namespace over collections, photos and records"></select>
  <span class="tab" data-tab="photos">photos</span>
  <span class="tab" data-tab="feeds">feeds</span>
  <span class="tab" data-tab="records">records</span>
  <span class="tab" data-tab="transforms">transforms</span>
  <span class="tab" data-tab="vaults">vaults</span>
  <span class="tab" data-tab="tokens">tokens</span>
  <span class="tab" data-tab="info">info</span>
  <span class="sp"></span>
  <a id="applink" class="hide" title="open the Snapz app pointed at this server">open in app</a>
  <span id="who" class="dim"></span>
  <button id="logout" class="hide">logout</button>
</div>
<div id="main"></div>
<div id="status"><span id="st-msg" class="dim">…</span><span class="sp"></span><span id="st-keys" class="dim"></span><span id="st-time" class="dim"></span></div>

<script>
"use strict";
// ---------------------------------------------------------------------------- util
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
function fmtTs(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function age(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 90) return `${Math.round(s)}s`;
  if (s < 5400) return `${Math.round(s / 60)}m`;
  if (s < 129600) return `${Math.round(s / 3600)}h`;
  return `${Math.round(s / 86400)}d`;
}
function fmtBytes(n) {
  if (n == null) return "";
  if (n < 1024) return `${n}B`;
  if (n < 1048576) return `${(n / 1024).toFixed(1)}K`;
  if (n < 1073741824) return `${(n / 1048576).toFixed(1)}M`;
  return `${(n / 1073741824).toFixed(2)}G`;
}
function say(msg, cls = "dim") { const el = $("#st-msg"); el.textContent = msg; el.className = cls; }

class HttpError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function api(method, path, body, opts = {}) {
  const init = { method, headers: {}, credentials: "same-origin", signal: AbortSignal.timeout(opts.timeout ?? 15000) };
  // Names (collections, records, the inbox) resolve in this vault. opts.vault overrides; null = name none.
  const vault = opts.vault === undefined ? S.vault : opts.vault;
  if (vault) init.headers["X-Snapz-Vault"] = vault;
  if (opts.raw) { init.body = opts.raw; init.headers["Content-Type"] = opts.raw.type || "application/octet-stream"; }
  else if (body !== undefined) { init.body = JSON.stringify(body); init.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, init);
  if (r.status === 401 && !opts.noLogin) { showLogin(); throw new HttpError(401, "not signed in"); }
  const text = await r.text();
  if (!r.ok) throw new HttpError(r.status, `${r.status} ${text.slice(0, 200)}`);
  return text ? JSON.parse(text) : null;
}
async function run(label, fn) {
  try { say(label + "…"); const v = await fn(); say(label + " ok", "ok"); return v; }
  catch (e) { say(`${label} failed: ${e.message}`, "bad"); throw e; }
}

// ---------------------------------------------------------------------------- state
const S = {
  tab: "photos", me: null,
  vault: null, vaults: [], defaultVault: null,  // vault: slug of the one being viewed (in the URL)
  pending: null,                        // a filing waiting for its verb: {collection, vault, tokens, actions:[{name,label,qty,p}]}
  allColls: {},                         // other vaults' collections, for cross-vault move/copy
  collections: [], coll: null,          // coll: slug | null (=all) | "~trash"
  photos: [], next: null, loading: false, sel: new Set(), cur: -1, anchor: -1,
  view: localStorage.snapzView || "grid", tile: +(localStorage.snapzTile || 112), barcode: "", q: "",
  recNs: null,
  openTok: null,                        // photo shown in the detail pane (also in the URL)
  feedCur: { photos: 0, collections: 0, results: 0, vaults: 0 }, // live-refresh positions in the change feeds
  inbox: null,                          // slug of the inbox collection (from /api/inbox)
  sug: {},                              // photo token -> ranked [{collection, p}] while viewing the inbox
  transforms: [],
  fresh: new Set(),                     // tokens changed by the last live update (flashed once)
};

// ---------------------------------------------------------------------------- url <-> state
// Everything needed to get back to what's on screen lives in the hash, so a URL can be pasted:
//   #/@<vault>/photos/<collection|~all|~trash>[/<photo token>][?view=table&bc=<barcode>]
//   #/@<vault>/records/<ns>   #/feeds   #/vaults   #/tokens   #/info
// (no @<vault> = the server's default vault)
const TABS = ["photos", "feeds", "records", "transforms", "vaults", "tokens", "info"];
function urlFor() {
  const v = S.vault && S.vault !== S.defaultVault ? "#/@" + encodeURIComponent(S.vault) + "/" : "#/";
  if (S.tab !== "photos") return v + S.tab + (S.tab === "records" && S.recNs ? "/" + encodeURIComponent(S.recNs) : "");
  let h = v + "photos/" + encodeURIComponent(S.coll ?? "~all");
  if (S.openTok) h += "/" + encodeURIComponent(S.openTok);
  const q = new URLSearchParams();
  if (S.view === "table") q.set("view", "table");
  if (S.barcode) q.set("bc", S.barcode);
  if (S.q) q.set("q", S.q);
  const qs = q.toString();
  return h + (qs ? "?" + qs : "");
}
// push = a navigation worth a Back step (tab, collection); otherwise replace in place.
function syncUrl(push = false) {
  const h = urlFor();
  if (location.hash === h) return;
  if (push) history.pushState(null, "", h); else history.replaceState(null, "", h);
}
function parseUrl() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean).map(decodeURIComponent);
  const q = new URLSearchParams(qs || "");
  const vault = parts[0]?.startsWith("@") ? parts.shift().slice(1) : null;
  const out = { vault, tab: "photos", coll: null, openTok: null, view: q.get("view") === "table" ? "table" : null, barcode: q.get("bc") || "", find: q.get("q") || "", recNs: null };
  if (TABS.includes(parts[0])) {
    out.tab = parts[0];
    if (out.tab === "photos") { out.coll = !parts[1] || parts[1] === "~all" ? null : parts[1]; out.openTok = parts[2] || null; }
    if (out.tab === "records") out.recNs = parts[1] || null;
  } else if (parts[0]) out.coll = parts[0]; // legacy "#pantry"
  return out;
}
function applyUrl() {
  const u = parseUrl();
  const want = S.me.vault || u.vault || S.defaultVault;
  S.vault = S.vaults.some(v => v.slug === want) ? want : (S.vaults[0]?.slug ?? S.defaultVault);
  if (u.vault && S.vault !== u.vault) say(`no vault '${u.vault}'`, "warn");
  renderVaultPicker();
  S.inbox = null; S.coll = u.coll; S.openTok = u.openTok; S.barcode = u.barcode; S.q = u.find;
  if (u.view) S.view = u.view; else if (location.hash.includes("/photos")) S.view = "grid";
  if (u.recNs) S.recNs = u.recNs;
  S.sel.clear(); S.cur = -1; S.anchor = -1;
  setTab(u.tab, false);
}
window.addEventListener("hashchange", () => { if (S.me && location.hash !== urlFor()) applyUrl(); });
const main = $("#main");
let poller = null; // the active tab's poll loop, if any

// One self-scheduling poll loop at a time: in-flight guard, hard timeout (in api()), parked while hidden.
function startPoll(fn, intervalMs) {
  stopPoll();
  const p = { live: true, inflight: false, timer: null };
  p.tick = async () => {
    if (!p.live || p.inflight || document.hidden) return;
    p.inflight = true;
    try { await fn(); $("#st-time").textContent = "upd " + fmtTs(new Date().toISOString()).slice(11); $("#st-time").className = "dim"; }
    catch (e) { $("#st-time").className = "bad"; $("#st-time").textContent = "stale: " + e.message.slice(0, 60); }
    finally { p.inflight = false; if (p.live && !document.hidden) p.timer = setTimeout(p.tick, intervalMs); }
  };
  p.vis = () => { if (!document.hidden) { clearTimeout(p.timer); p.tick(); } };
  document.addEventListener("visibilitychange", p.vis);
  poller = p;
  p.tick();
}
function stopPoll() {
  if (!poller) return;
  poller.live = false; clearTimeout(poller.timer);
  document.removeEventListener("visibilitychange", poller.vis);
  poller = null;
  $("#st-time").textContent = "";
}

// ---------------------------------------------------------------------------- login
async function showLogin() {
  stopPoll();
  let info = { oidc: false };
  try { info = await api("GET", "/auth/info", undefined, { noLogin: true }); } catch (e) { /* keep default */ }
  const back = encodeURIComponent("/" + location.hash);
  main.innerHTML = `<div id="login">
    <div><b class="acc">snapz</b> <span class="dim">— sign in</span></div>
    ${info.oidc ? `<p><a href="/auth/login?return_to=${back}"><button>sign in with SSO</button></a></p>` : `<p class="dim">SSO is not configured on this server.</p>`}
    <form id="tl"><div class="dim">or paste an API token</div>
    <input id="tl-tok" type="password" autocomplete="off" placeholder="snapz_…">
    <button>use token</button> <span id="tl-err" class="bad"></span></form></div>`;
  $("#who").textContent = ""; $("#logout").classList.add("hide"); $("#vault").classList.add("hide"); S.me = null;
  $("#tl").onsubmit = async ev => {
    ev.preventDefault();
    try { await api("POST", "/auth/token-login", { token: $("#tl-tok").value }, { noLogin: true }); boot(); }
    catch (e) { $("#tl-err").textContent = e.status === 401 ? "bad token" : e.message; }
  };
}
$("#logout").onclick = async () => { await api("POST", "/auth/logout", undefined, { noLogin: true }); showLogin(); };

// ---------------------------------------------------------------------------- vaults
async function loadVaults() {
  const r = await api("GET", "/api/vaults", undefined, { vault: null });
  S.vaults = r.vaults; S.defaultVault = r.default;
  renderVaultPicker();
}
function renderVaultPicker() {
  const el = $("#vault");
  el.classList.toggle("hide", !S.me);
  el.disabled = S.vaults.length < 2;
  el.innerHTML = S.vaults.map(v => `<option value="${esc(v.slug)}">${esc(v.icon || "▣")} ${esc(v.slug)} · ${v.photo_count}</option>`).join("");
  if (S.vault) el.value = S.vault;
}
function selectVault(slug) {
  if (slug === S.vault) return;
  S.vault = slug; S.coll = null; S.openTok = null; S.recNs = null; S.inbox = null; S.sug = {}; S.sel.clear(); S.cur = -1; S.anchor = -1; S.barcode = ""; S.q = "";
  renderVaultPicker();
  setTab(S.tab === "vaults" ? "photos" : S.tab);
}
$("#vault").onchange = ev => selectVault(ev.target.value);

async function vaultsTab() {
  // Operators manage every vault; anyone else manages the ones they own. A vault-pinned or read-only credential manages nothing.
  const admin = S.me.admin || (S.me.operator === false && !S.me.read_only && !S.me.vault);
  const mine = v => S.me.admin || v.role === "owner";
  main.innerHTML = `<div class="pane"><h3>vaults <span class="dim" style="font-weight:400">— a namespace over collections, photos, records and the inbox. The same collection name in two vaults is two collections. Blobs are deduplicated across all of them.</span></h3>
    <div id="v-list"></div>
    <div id="v-people"></div>
    ${admin ? `<h3>new vault</h3><form id="v-new"><input id="v-name" placeholder="name, e.g. Work" size="24"> <input id="v-icon" placeholder="icon" size="4"> <input id="v-desc" placeholder="description" size="40"> <button>create</button></form>` : `<p class="dim">This credential is pinned to one vault.</p>`}
    <h3>selecting one</h3><pre class="dim" style="margin:0">X-Snapz-Vault: work          header (what this page and snapz.py send; SNAPZ_VAULT=work)
…/api/collections?vault=work   or a query parameter
(neither)                      the default vault for names; feeds carry every vault
photos, blobs and intents are addressed by token and found wherever they live;
moving a photo to a collection moves it into the request's vault</pre></div>`;
  const load = async () => {
    await loadVaults();
    $("#v-list").innerHTML = `<table><thead><tr><th></th><th>vault</th><th>name</th><th class="n">colls</th><th class="n">photos</th><th class="n">size</th><th class="n">last</th><th>created</th><th>description</th><th></th></tr></thead><tbody>` +
      S.vaults.map(v => `<tr class="${v.slug === S.vault ? "sel" : ""}"><td>${esc(v.icon || "▣")}</td><td><a href="#/@${encodeURIComponent(v.slug)}/photos/~all" class="${v.slug === S.vault ? "ok" : ""}">${esc(v.slug)}</a>${v.is_default ? ' <span class="dim">default</span>' : ""}</td>
        <td>${esc(v.name)}</td><td class="n">${v.collection_count}</td><td class="n">${v.photo_count}</td><td class="n dim">${fmtBytes(v.bytes)}</td><td class="n dim">${age(v.last_photo_at)}</td><td class="dim">${fmtTs(v.created_at)}</td>
        <td class="wrap dim" style="word-break:normal">${esc(v.description)}</td>
        <td>${admin ? `<button data-sh="${esc(v.slug)}" title="who can see this vault${mine(v) ? "; share it" : ""}">people</button>` +
          (S.me.operator === false ? ` <button data-al="${esc(v.slug)}" title="call it something else; only your view changes">rename</button>` : "") +
          (mine(v) ? ` <button data-ed="${esc(v.slug)}">edit</button> <button class="danger" data-rm="${esc(v.slug)}" ${v.is_default ? "disabled title='your default vault cannot be deleted'" : ""}>delete</button>` : ` <span class="dim">${esc(v.role || "")}</span>`) : ""}</td></tr>`).join("") + `</tbody></table>`;
    $("#v-list").querySelectorAll("[data-ed]").forEach(b => b.onclick = async () => {
      const v = S.vaults.find(x => x.slug === b.dataset.ed);
      const name = prompt("Name", v.name); if (name == null) return;
      const icon = prompt("Icon (one emoji)", v.icon || ""); if (icon == null) return;
      const description = prompt("Description", v.description || ""); if (description == null) return;
      await run("update vault", () => api("PATCH", `/api/vaults/${encodeURIComponent(v.slug)}`, { name, icon, description }, { vault: null })); load();
    });
    $("#v-list").querySelectorAll("[data-sh]").forEach(b => b.onclick = () => { S.peopleOf = b.dataset.sh; people(); });
    $("#v-list").querySelectorAll("[data-al]").forEach(b => b.onclick = async () => {
      const to = prompt(`Your name for '${b.dataset.al}' (letters, digits, - and _). Nobody else's view changes.`, b.dataset.al);
      if (!to || to === b.dataset.al) return;
      await run("rename", () => api("PUT", `/api/vaults/${encodeURIComponent(b.dataset.al)}/alias`, { slug: to.trim().toLowerCase() }, { vault: null }));
      if (S.vault === b.dataset.al) { S.vault = to.trim().toLowerCase(); syncUrl(); }
      if (S.peopleOf === b.dataset.al) S.peopleOf = to.trim().toLowerCase();
      load();
    });
    $("#v-list").querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
      const v = S.vaults.find(x => x.slug === b.dataset.rm);
      if (!confirm(`Delete vault '${v.slug}'` + (v.photo_count ? ` and move its ${v.photo_count} photos to the trash?` : "?") + "\nTokens pinned to it stop working.")) return;
      await run("delete vault", () => api("DELETE", `/api/vaults/${encodeURIComponent(v.slug)}?force=true`, undefined, { vault: null }));
      if (S.vault === v.slug) { S.vault = S.defaultVault; syncUrl(); }
      load();
    });
  };
  // Who can reach one vault: members (with a role) and invitations not yet used.
  const people = async () => {
    const slug = S.peopleOf, box = $("#v-people"); if (!slug || !box) return;
    const path = `/api/vaults/${encodeURIComponent(slug)}`;
    let m, inv;
    const owner = mine(S.vaults.find(v => v.slug === slug) || {});
    // Invitations make accounts: only the people who run the server send (or see) them.
    try { [m, inv] = await Promise.all([api("GET", path + "/members", undefined, { vault: null }), S.me.admin ? api("GET", path + "/invites", undefined, { vault: null }) : { invites: [] }]); }
    catch (e) { box.innerHTML = `<div class="bad">${esc(e.message)}</div>`; return; }
    const pending = inv.invites.filter(i => !i.accepted_at);
    box.innerHTML = `<h3>people in ${esc(slug)} <a class="dim" style="font-weight:400;cursor:pointer" id="p-close">close</a></h3>
      <table><thead><tr><th>who</th><th>role</th><th>since</th><th></th></tr></thead><tbody>` +
      (m.members.map(x => `<tr><td>${esc(x.principal)}</td><td>${esc(x.role)}</td><td class="dim">${fmtTs(x.since)}</td><td>${owner ? `<button class="danger" data-un="${esc(x.principal)}">remove</button>` : ""}</td></tr>`).join("") ||
        `<tr><td colspan="4" class="dim">nobody but the people who run the server</td></tr>`) + `</tbody></table>` +
      (owner ? `<form id="p-add" style="margin-top:4px"><input id="p-email" type="email" placeholder="email" size="28"> ${S.me.admin ? `<input id="p-name" placeholder="name (new people)" size="18">` : ""}
        <select id="p-role"><option>viewer</option><option>editor</option><option>owner</option></select>
        ${S.me.admin ? `<button name="how" value="invite" title="makes their sign-in account if they have none, shares the vault, and gives you a link to send">invite</button>` : ""}
        <button name="how" value="share" title="someone who already signs in here: no link needed">share</button></form>` : "") +
      (pending.length ? `<table style="margin-top:4px"><thead><tr><th>invited</th><th>role</th><th>expires</th><th>link to send</th><th></th></tr></thead><tbody>` +
        pending.map(i => `<tr><td>${esc(i.email)}</td><td>${esc(i.role)}</td><td class="dim">${fmtTs(i.expires_at)}</td><td><input readonly size="46" value="${esc(i.url)}" onclick="this.select()"> <button data-cp="${esc(i.url)}">copy</button></td><td><button class="danger" data-rv="${esc(i.code)}">withdraw</button></td></tr>`).join("") + `</tbody></table>` : "");
    $("#p-close").onclick = () => { S.peopleOf = null; box.innerHTML = ""; };
    box.querySelectorAll("[data-un]").forEach(b => b.onclick = async () => {
      if (!confirm(`Remove ${b.dataset.un} from '${slug}'?`)) return;
      await run("remove", () => api("DELETE", `${path}/members?principal=${encodeURIComponent(b.dataset.un)}`, undefined, { vault: null })); people();
    });
    box.querySelectorAll("[data-rv]").forEach(b => b.onclick = async () => { await run("withdraw", () => api("DELETE", `/api/invites/${encodeURIComponent(b.dataset.rv)}`, undefined, { vault: null })); people(); });
    box.querySelectorAll("[data-cp]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.cp); say("link copied", "ok"); } catch (e) { say("select the link and copy it", "warn"); } });
    if ($("#p-add")) $("#p-add").onsubmit = async ev => {
      ev.preventDefault();
      const email = $("#p-email").value.trim(), role = $("#p-role").value, name = $("#p-name")?.value.trim() || undefined; if (!email) return;
      if (ev.submitter?.value === "share") await run("share", () => api("PUT", path + "/members", { principal: email, role }, { vault: null }));
      else {
        const r = await run("invite", () => api("POST", path + "/invites", { email, role, name }, { vault: null }));
        say(`invited ${r.email}: ${r.account === "created" ? "account made" : r.account === "existing" ? "they already had an account" : "make their account by hand"}; send them the link below`, "ok");
      }
      await people();
    };
  };
  if (S.peopleOf) people();
  if (admin) $("#v-new").onsubmit = async ev => {
    ev.preventDefault();
    const name = $("#v-name").value.trim(); if (!name) return;
    await run("create vault", () => api("POST", "/api/vaults", { name, icon: $("#v-icon").value.trim() || undefined, description: $("#v-desc").value.trim() || undefined }, { vault: null }));
    ev.target.reset(); load();
  };
  startPoll(load, 5000);
}

function setTile(px) {

function toggleView() { S.view = S.view === "grid" ? "table" : "grid"; localStorage.snapzView = S.view; $("#b-view").textContent = S.view === "grid" ? "table" : "grid"; syncUrl(); renderPhotos(); }

async function loadCollections() {
  const others = S.vaults.filter(v => v.slug !== S.vault);
  const [mine, ...rest] = await Promise.all([api("GET", "/api/collections"), ...others.map(v => api("GET", "/api/collections", undefined, { vault: v.slug }).catch(() => ({ collections: [] })))]);
  S.collections = mine.collections;
  S.allColls = Object.fromEntries(others.map((v, i) => [v.slug, rest[i].collections]));
  renderSide();
}
function renderSide() {
  const side = $("#side"); if (!side) return;
  const tot = S.collections.reduce((a, c) => ({ n: a.n + c.photo_count, b: a.b + c.bytes }), { n: 0, b: 0 });
  const row = (key, icon, name, n, bytes, last, extra = "") =>
    `<tr data-c="${esc(key)}" class="${(S.coll ?? "") === key ? "on" : ""}"><td>${esc(icon || "·")}</td><td class="name" title="${esc(name)}${extra ? " — " + esc(extra) : ""}">${esc(name)}</td>

    ${row("", "∗", "all", tot.n, tot.b, S.collections.map(c => c.last_photo_at).filter(Boolean).sort().pop())}
    ${S.collections.map(c => row(c.slug, c.icon, c.slug, c.photo_count, c.bytes, c.last_photo_at, [c.description || c.name, c.actions.length ? "actions: " + c.actions.map(a => a.name).join(" / ") : ""].filter(Boolean).join(" — "))).join("")}
    ${row("~trash", "␡", "trash", null, null, null)}
    </tbody></table>
    <div style="padding:3px 6px;display:flex;gap:4px;flex-wrap:wrap">
      <button id="c-new">+ collection</button>
      <button id="c-edit" ${S.coll && !inTrash() ? "" : "disabled"}>edit</button>
      <button id="c-del" class="danger" ${S.coll && !inTrash() ? "" : "disabled"}>delete</button>
    </div>`;
  side.querySelectorAll("tr[data-c]").forEach(tr => tr.onclick = () => selectColl(tr.dataset.c || null));
  $("#c-new").onclick = async () => {
    const name = prompt("New collection name (slug is derived: lowercase, dashes)"); if (!name) return;
    const icon = prompt("Icon (one emoji, optional)") || undefined;
    const c = await run("create collection", () => api("POST", "/api/collections", { name, icon }));
    await loadCollections(); selectColl(c.slug);
  };
  $("#c-edit").onclick = async () => {
    const c = S.collections.find(x => x.slug === S.coll); if (!c) return;
    const name = prompt("Name", c.name); if (name == null) return;
    const description = prompt("Description", c.description || ""); if (description == null) return;
    const icon = prompt("Icon", c.icon || ""); if (icon == null) return;
    const before = c.actions.map(a => a.name + (a.qty ? "#" : "")).join(", ");
    const acts = prompt("Actions: the verbs a photo filed here can carry.\nComma-separated; add # to ones that take a quantity (e.g. consume#, out, purchase#, count#). Blank = none.", before);
    if (acts == null) return;
    await run("update collection", () => api("PATCH", `/api/collections/${encodeURIComponent(c.slug)}`, { name, description, icon }));
    if (acts.trim() !== before) {
      const actions = acts.split(",").map(x => x.trim()).filter(Boolean).map(x => ({ name: x.replace(/#$/, ""), qty: x.endsWith("#"), label: c.actions.find(a => a.name === x.replace(/#$/, ""))?.label }));
      await run("set actions", () => api("PUT", `/api/collections/${encodeURIComponent(c.slug)}/actions`, { actions }));
    }
    loadCollections();
  };
  $("#c-del").onclick = async () => {
    const c = S.collections.find(x => x.slug === S.coll); if (!c) return;
    if (!confirm(`Delete collection '${c.slug}'` + (c.photo_count ? ` and move its ${c.photo_count} photos to the trash?` : "?"))) return;
    await run("delete collection", () => api("DELETE", `/api/collections/${encodeURIComponent(c.slug)}?force=true`));
    S.coll = null; refreshAll();
  };
  const dest = $("#b-dest");
  if (dest) {

    dest.innerHTML = S.collections.map(c => `<option value="${esc(c.slug)}">→ ${esc(c.slug)}</option>`).join("") +
      Object.entries(S.allColls).map(([v, cs]) => `<optgroup label="vault ${esc(v)}">${cs.map(c => `<option value="${esc(v)}\t${esc(c.slug)}">→ @${esc(v)}/${esc(c.slug)}</option>`).join("")}</optgroup>`).join("");
    if (keep && [...dest.options].some(o => o.value === keep)) dest.value = keep;
  }
}
function selectColl(slug) {
  S.coll = slug; S.sel.clear(); S.cur = -1; S.anchor = -1; S.openTok = null; S.pending = null;
  syncUrl(true);
  renderSide(); loadPhotos(true);
}

async function loadPhotos(reset) {
  if (S.loading) return;
  if (!reset && !S.next) return;
  S.loading = true;
  try {
    const q = new URLSearchParams({ limit: "300" });
    if (inTrash()) q.set("deleted", "true"); else if (S.coll) q.set("collection", S.coll);
    if (S.barcode) q.set("barcode", S.barcode);
    if (S.q) q.set("q", S.q);
    if (!reset && S.next) q.set("before", S.next);
    const page = await api("GET", "/api/photos?" + q);
    S.photos = reset ? page.photos : S.photos.concat(page.photos);
    await loadSuggestions();
    S.next = page.next_before ?? null;
    if (reset) { $("#content").scrollTop = 0; await reopenDetail(); }
    renderPhotos();
    say(`${collLabel()}: ${S.photos.length}${S.next ? "+" : ""} photos`);
  } catch (e) { if (e.status !== 401) say("load failed: " + e.message, "bad"); }
  finally { S.loading = false; }
}

        ${p.note && !S.sel.has(p.token) && !S.sug[p.token] ? `<span class="nt" title="${esc(p.note)}">n</span>` : ""}
        ${S.sug[p.token]?.[0] && !S.sel.has(p.token) ? `<span class="sg">${esc(S.sug[p.token][0].collection)} ${pct(S.sug[p.token][0].p)}</span>` : ""}
        <span class="cap">${fullPct(p) ? `<b class="${p.meta.fullness <= 0.2 ? "bad" : p.meta.fullness <= 0.5 ? "warn" : "ok"}" title="how full${p.meta.fullness_of ? ": " + esc(p.meta.fullness_of) : ""}">${fullPct(p)}</b> ` : ""}${p.meta?.action ? `<b class="warn">${esc(p.meta.action)}${p.meta.qty != null ? " " + esc(p.meta.qty) : ""}</b> ` : ""}${facts(p).map(([c, t, tip]) => `<b class="${c}" title="${esc(tip)}">${esc(t)}</b> `).join("")}${esc(fmtTs(p.taken_at).slice(5, 16))}${showColl ? " " + esc(p.collection) : ""}</span>
      </div>`).join("") + `</div>`;
  } else {

      S.photos.map((p, i) => `<tr data-i="${i}" class="${S.sel.has(p.token) ? "sel" : ""}${i === S.cur ? " cur" : ""}${S.fresh.has(p.token) ? " chg" : ""}" style="cursor:pointer">
        <td style="padding:0"><img loading="lazy" src="${esc(p.thumb_url)}" alt="" style="height:28px;width:28px;object-fit:cover;display:block"></td>

        <td class="warn">${esc(p.meta?.action ?? "")}${p.meta?.qty != null ? " " + esc(p.meta.qty) : ""}</td><td class="dim">${esc(p.token)}</td><td class="n">${p.width ?? "?"}×${p.height ?? "?"}</td><td class="n">${fmtBytes(p.bytes)}</td>
        <td class="ok">${esc(p.barcodes.join(" "))}</td><td style="max-width:320px;overflow:hidden;text-overflow:ellipsis">${esc(p.note)}</td>
        <td class="n ${p.feed_sync_id == null ? "warn" : "dim"}">${p.feed_sync_id ?? "pend"}</td></tr>`).join("") + `</tbody></table>`;

}
// After a (re)load: put the detail pane back on the photo named in the URL, even when it isn't in
// the loaded page (deep link to an old photo, or to one in another collection).
async function reopenDetail() {
  if (!S.openTok) { closeDetail(false); return; }
  let i = S.photos.findIndex(p => p.token === S.openTok);
  let p = S.photos[i];
  if (!p) { try { p = await api("GET", `/api/photos/${encodeURIComponent(S.openTok)}`); } catch (e) { p = null; } }
  if (!p) { say(`photo ${S.openTok} not found`, "warn"); closeDetail(); return; }
  if (i >= 0) { S.cur = i; S.anchor = i; }
  showDetail(p);
  if (i >= 0) requestAnimationFrame(() => $(`[data-i="${i}"]`)?.scrollIntoView({ block: "nearest" }));
}
// Detected regions (meta.barcodes[].box = [x, y, w, h] fractions of the upright image) as overlays.
function boxesHtml(p) {
  return (p.meta?.barcodes || []).filter(b => Array.isArray(b.box) && b.box.length === 4).map(b => {
    const [x, y, w, h] = b.box.map(v => Math.max(0, Math.min(1, +v)) * 100);
    return `<div class="bx${b.source === "live" ? " live" : ""}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"><span>${esc(b.symbology || "?")} ${esc(b.value)}</span></div>`;
  }).join("");
}
// click = focus + open detail; cmd/ctrl-click = toggle; shift-click = range
function pick(i, ev) {
  const p = S.photos[i]; if (!p) return;

async function liveTick() {
  const [photos, colls, results, vaults] = await Promise.all([drainFeed("photos"), drainFeed("collections"), drainFeed("results"), drainFeed("vaults")]);
  if (vaults.length || photos.length) await loadVaults();
  if (!S.vaults.some(v => v.slug === S.vault)) { say(`vault '${S.vault}' was deleted`, "warn"); return selectVault(S.defaultVault); }
  if (S.openTok && results.some(r => r.photo === S.openTok)) { const p = S.photos.find(x => x.token === S.openTok); if (p) loadHistory(p); }
  if (!photos.length && !colls.length) return;

      if (at < 0) at = S.photos.length;
      // Older than everything loaded while more pages exist: it will arrive by scrolling.
      if (at === S.photos.length && S.next) continue;
      S.photos.splice(at, 0, e); S.fresh.add(e.token); changed++;
    }

  }

    S.cur = curTok ? S.photos.findIndex(p => p.token === curTok) : -1;
    S.anchor = anchorTok ? S.photos.findIndex(p => p.token === anchorTok) : -1;
    renderPhotos(); S.fresh.clear();
    say(`live: ${changed} change${changed > 1 ? "s" : ""} · ${collLabel()}: ${S.photos.length}${S.next ? "+" : ""} photos`, "ok");
  }

}

// crypto.randomUUID only exists on https / localhost; a LAN http page still needs an id.
const newId = () => crypto.randomUUID ? crypto.randomUUID() : [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
let uploading = false;
async function uploadFiles(files) {
  files = files.filter(f => f.type.startsWith("image/") || /\.(jpe?g|png|heic|webp|gif)$/i.test(f.name || ""));
  if (!files.length) return;
  if (uploading) return say("an upload is already running", "warn");
  const coll = await uploadTarget(), vault = S.vault;
  if (!coll) return say("pick a collection to upload into", "warn");
  uploading = true;
  let ok = 0, failed = 0, why = "";
  try {
    for (const f of files) {
      const name = f.name || "pasted";
      say(`uploading ${ok + failed + 1}/${files.length} ${name} → ${coll}…`);
      // client_id makes the retry safe: a request that landed but whose response was lost is not duplicated.
      const q = new URLSearchParams({ collection: coll, taken_at: String(f.lastModified || Date.now()), client_id: newId(),
        meta: JSON.stringify({ source: "web", filename: name }) });
      let done = false;
      for (let attempt = 0; attempt < 2 && !done; attempt++) {
        try { await api("POST", "/api/photos?" + q, undefined, { raw: f, timeout: 120000, vault }); done = true; }
        catch (e) { why = e.message; if (e instanceof HttpError && e.status < 500) break; }
      }
      if (done) ok++; else failed++;
    }
  } finally { uploading = false; }
  // After the refresh, so its own status line does not bury a failure.
  try { await refreshAll(); } catch (e) { /* the upload result is the news */ }
  say(`uploaded ${ok}/${files.length} → ${coll}` + (failed ? `, ${failed} failed: ${why}` : ""), failed ? "bad" : "ok");
}

  // Clipboard images are all called image.png: give each a name that says when it was pasted.
  const ts = new Date().toISOString().replace(/[:.]/g, "-");
  uploadFiles(files.map((f, i) => new File([f], `pasted-${ts}${files.length > 1 ? "-" + (i + 1) : ""}.${(f.type.split("/")[1] || "png").replace("jpeg", "jpg")}`, { type: f.type, lastModified: Date.now() })));
});

function photoKeys(ev) {
  if (ev.target.matches("input,textarea,select") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const n = S.photos.length;
  let perRow = 1;
  if (S.view === "grid") { const g = $("#grid"); if (g) perRow = getComputedStyle(g).gridTemplateColumns.split(" ").length; }
  const go = i => { if (!n) return; i = Math.max(0, Math.min(n - 1, i)); pick(i, ev.shiftKey ? { shiftKey: true } : null); $(`[data-i="${i}"]`)?.scrollIntoView({ block: "nearest" }); };
  const k = ev.key;
  if (S.pending) {  // the verb step owns the keyboard until it is answered
    if (/^[1-9]$/.test(k)) choosePending(+k - 1);
    else if (k === "0" || k === "Enter") choosePending(-1);
    else if (k === "Escape") cancelPending();
    else return;
    ev.preventDefault(); return;
  }
  if (k === "t") labelSelection();
  else if (k === "ArrowRight" || k === "l") go(S.cur + 1);
  else if (k === "ArrowLeft" || k === "h") go(S.cur - 1);
  else if (k === "ArrowDown" || k === "j") go(S.cur + perRow);
  else if (k === "ArrowUp" || k === "k") go(S.cur - perRow);
  else if (k === "x" || k === " ") { const p = S.photos[S.cur]; if (p) { S.sel.has(p.token) ? S.sel.delete(p.token) : S.sel.add(p.token); S.anchor = S.cur; renderPhotos(); } }
  else if (k === "a") $("#b-all").click();
  else if (k === "Escape") { if ($("#detail").classList.contains("on")) closeDetail(); else { S.sel.clear(); renderPhotos(); } }
  else if (k === "Delete" || k === "Backspace") { if (!inTrash()) batch("delete"); }
  else if (k === "m") batch("move");
  else if (k === "c") { if (!inTrash()) batch("copy"); }
  else if (k === "r") { if (inTrash()) batch("restore"); else refreshAll(); }
  else if (/^[1-9]$/.test(k) && S.coll && S.coll === S.inbox) {
    const p = S.photos[S.cur]; const g = p && S.sug[p.token]?.[+k - 1];
    if (g) startFiling(g.collection, S.sel.size ? [...S.sel] : [p.token]);
  }
  else if (k === "v") toggleView();
  else if (k === "u") $("#b-file").click();
  else if (k === "+" || k === "=") setTile(S.tile + 24);
  else if (k === "-") setTile(S.tile - 24);
  else return;
  ev.preventDefault();
}

function setTab(tab, push = true) {
  S.tab = tab; stopPoll();
  syncUrl(push);
  document.querySelectorAll("#top .tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
  $("#st-keys").textContent = tab === "photos" ? "live · 1–9 file (inbox) · t label · ←↑↓→ move · x sel · ⇧click range · ⌘click toggle · m move · c copy · ⌫ del · v view · +/- size · esc" : "";
  if (tab === "photos") {
    photosShell();
    // Feed positions first, then the snapshot: anything in between is re-applied, never missed.
    initLive().catch(() => {}).then(refreshAll).then(() => { if (S.tab === "photos") startPoll(liveTick, 2000); });
  }
  else if (tab === "feeds") feedsTab();
  else if (tab === "records") recordsTab();
  else if (tab === "transforms") transformsTab();
  else if (tab === "vaults") vaultsTab();
  else if (tab === "info") infoTab();
  else tokensTab();
}
document.querySelectorAll("#top .tab").forEach(t => t.onclick = () => { if (S.me) setTab(t.dataset.tab); });
document.addEventListener("keydown", ev => { if (S.me && S.tab === "photos") photoKeys(ev); });

// On a phone: a link that opens the Snapz app and offers to point it at this server.
if (matchMedia("(pointer:coarse)").matches) {
  const a = $("#applink");
  a.href = `snapz://${location.host}${location.protocol === "http:" ? "?insecure=1" : ""}`;
  a.classList.remove("hide");
}

async function boot() {
  // Ask the open endpoint first: a visitor who is not signed in should not produce a 401 on every
  // page load (intrusion detection in front of the server counts those, and bans on a handful).
  try { const info = await api("GET", "/auth/info", undefined, { noLogin: true }); if (!info.principal) return showLogin(); } catch (e) { /* fall through to /api/me */ }
  try { S.me = await api("GET", "/api/me"); } catch (e) { if (e.status !== 401) say("server unreachable: " + e.message, "bad"); return; }
  $("#who").textContent = S.me.principal + (S.me.vault ? ` @${S.me.vault}` : "") + (S.me.read_only ? " ro" : ""); $("#logout").classList.remove("hide");
  document.querySelector('#top .tab[data-tab="tokens"]').classList.toggle("hide", !S.me.admin);
  // Feeds, transforms and vault management are for the people who run the server.
  for (const t of ["feeds", "transforms"]) document.querySelector(`#top .tab[data-tab="${t}"]`).classList.toggle("hide", S.me.operator === false);
  try { await loadVaults(); } catch (e) { say("could not load vaults: " + e.message, "bad"); return; }
  applyUrl();
}
boot();
</script>
</body>
</html>
